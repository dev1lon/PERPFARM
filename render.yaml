# RETIRED 2026-10-09. The hourly collector now runs on GitHub Actions
# (.github/workflows/sync-snapshots.yml). Suspend or delete the Render service
# below: if both run, the same hour is written twice. Kept only as a record of
# how the cron was configured there.
#
# Render Blueprint (Infrastructure as Code) for perpfarm.
#
# Scope: the Python worker CRONS only. The web app runs on Vercel (main =
# production, staging = preview), and the database is an external Supabase
# Postgres -- so there is no web service and no Render-managed database here.
#
# DATABASE_URL is `sync: false`: set it in the Render dashboard to the PROD
# Supabase Session-pooler URL with `?sslmode=require` appended -- the same
# database the Vercel production deployment reads from. psycopg honours
# `sslmode` natively, so no extra SSL config is needed on the worker side.
#
# Migrations are NOT run automatically (running `alembic upgrade head` from
# multiple services at once races). Run it once per schema-changing deploy
# against the prod Supabase -- locally, or from a Render Shell tab on any cron
# service (the shell opens inside rootDir worker/): python -m alembic upgrade head
#
# The field names below (runtime/schedule/envVars) are confirmed by the cron
# running in production, not just by the Blueprint spec.

services:
  # The one cron. Hourly market-data sync
  # (worker/perpfarm/jobs/sync_snapshots.py) writes
  # book_snapshots/funding_snapshots/volume_snapshots per active market.
  # Folded in so nothing else needs its own cron:
  #  - refresh-catalog runs first EACH hour (new venues/markets + manual YAML),
  #    so new listings enter the DB and get collected the same hour;
  #  - fee-watch runs once a week (Monday, 06:xx UTC) to diff fee pages.
  # Both are non-fatal: a hiccup in either never blocks snapshot writes.
  #
  # A run is normally over in a couple of minutes, but a venue that was down
  # when the hour struck is retried inside the same run (5 min apart, 5 times),
  # so an unlucky hour can keep this job alive for ~30 minutes. That is by
  # design and still finishes before the next one starts.
  - type: cron
    name: perpfarm-sync-snapshots
    runtime: python
    rootDir: worker
    plan: starter
    region: oregon
    schedule: "0 * * * *" # hourly
    buildCommand: pip install -e .
    startCommand: perpfarm job sync-snapshots
    # rootDir alone makes Render skip an autodeploy when a commit touches no
    # file under worker/. The hourly catalog refresh reads
    # data/manual/symbol_overrides.yaml from the REPOSITORY root (cli.py
    # resolves REPO_ROOT / data / manual), so a commit that only adds a
    # canonical-symbol override never reached this cron, and the rename it was
    # meant to apply silently never happened: Entropy io:ANTH kept the
    # canonical ANTH and never paired with QFEX ANTHROPIC. Build filter paths
    # are relative to the repository root even when rootDir is set, so both
    # directories are listed here.
    buildFilter:
      paths:
        - worker/**
        - data/**
    envVars:
      - key: DATABASE_URL
        sync: false
      # TxFlow's numbers live on its official Dune dashboard, and the hourly run
      # copies them into `venue_daily_stats` so the website reads Postgres
      # rather than a third party. Set this in the Render dashboard -- the same
      # key the web app already has. Without it the run logs
      # "dune: skipped (no DUNE_API_KEY)" and the site falls back to asking Dune
      # itself, exactly as it did before: a missing key costs freshness and
      # independence, never a chart.
      - key: DUNE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
