# Render Blueprint (Infrastructure as Code) for perpfarm.
#
# Scope: the Python worker CRONS only. The web app runs on Vercel (main =
# production, staging = preview), and the database is an external Supabase
# Postgres -- so there is no web service and no Render-managed database here.
#
# DATABASE_URL is `sync: false`: set it in the Render dashboard to the PROD
# Supabase Session-pooler URL with `?sslmode=require` appended -- the same
# database the Vercel production deployment reads from. psycopg honours
# `sslmode` natively, so no extra SSL config is needed on the worker side.
#
# Migrations are NOT run automatically (running `alembic upgrade head` from
# multiple services at once races). Run it once per schema-changing deploy
# against the prod Supabase -- locally, or from a Render Shell tab on any cron
# service (the shell opens inside rootDir worker/): python -m alembic upgrade head
#
# TODO(verify): confirm Blueprint field names (runtime/schedule/envVars) against
# https://render.com/docs/blueprint-spec before deploying.

services:
  # Hourly market-data sync (worker/perpfarm/jobs/sync_snapshots.py) --
  # writes book_snapshots/funding_snapshots/volume_snapshots per active market
  # (the live Run reads these). It ALSO runs refresh-catalog first each hour
  # (register new venues/markets + ingest manual YAML), so new listings enter
  # the DB and get collected the same hour -- no separate daily cron needed.
  # The refresh is non-fatal: a catalog hiccup never blocks snapshot writes.
  - type: cron
    name: perpfarm-sync-snapshots
    runtime: python
    rootDir: worker
    plan: starter
    region: oregon
    schedule: "0 * * * *" # hourly
    buildCommand: pip install -e .
    startCommand: perpfarm job sync-snapshots
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Fee-page diff watcher (worker/perpfarm/jobs/fee_watch.py). Skips venues
  # whose adapter still raises NotImplementedError -- see docs/deploy.md.
  # Writes `alerts` rows on a detected change but does not deliver them
  # anywhere yet; no notification channel is wired up.
  - type: cron
    name: perpfarm-fee-watch
    runtime: python
    rootDir: worker
    plan: starter
    region: oregon
    schedule: "0 0 * * 0" # weekly, Sunday 00:00 UTC
    buildCommand: pip install -e .
    startCommand: perpfarm job fee-watch
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
