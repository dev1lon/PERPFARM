# Native-ticker -> canonical-symbol overrides, applied by
# `perpfarm sync-markets` for tickers an adapter can't normalize on its own
# (e.g. a venue listing 'kPEPE-PERP' should map to canonical 'PEPE' so it
# matches other venues' 'PEPE-PERP'). Not written to any DB table.
#
# ONLY map two tickers together when they are the SAME instrument at the SAME
# scale. A canonical symbol is what the cross-venue table matches on and what
# the spread-risk job compares marks across, so two contracts merged under one
# name are compared mark to mark as if their prices should agree.
#
# The S&P 500 is the counter-example: it is listed at two scales and the ticker
# does not say which. Polymarket's SP500, trade.xyz's SP500 and QFEX's US500-USD
# trade the full index (~7,600) and are merged below; Variational's US500 and
# the SPY perps trade a tenth of it (~760) and are never merged with them --
# that would invent a permanent 90% "divergence" and price a hedge that does
# not hedge. (worker/tests/test_symbol_overrides_scale.py guards this.)

overrides:
  - venue: venue_alpha
    symbol: kPEPE-PERP
    symbol_canonical: PEPE

  # trade.xyz spells metals and Brent out; Variational, TxFlow and RiseX use the
  # exchange codes. Same instrument, same scale -- checked 2026-09-10 against
  # the collected marks: xyz:GOLD 4351.4 vs XAU 4351.7-4358.0, xyz:SILVER 64.10
  # vs XAG 64.09-64.30, xyz:PLATINUM 1794.1 vs XPT 1795.1-1798.6,
  # xyz:PALLADIUM 1289.3 vs XPD 1289.8-1292.2, xyz:BRENTOIL 104.44 vs BZ
  # 104.65-104.74. xyz:CL already matches CL, and xyz:SP500 already matches
  # Polymarket's SP500 at the same ~7,593 scale, so neither is mapped.
  - venue: tradexyz
    symbol: xyz:GOLD
    symbol_canonical: XAU
  - venue: tradexyz
    symbol: xyz:SILVER
    symbol_canonical: XAG
  - venue: tradexyz
    symbol: xyz:PLATINUM
    symbol_canonical: XPT
  - venue: tradexyz
    symbol: xyz:PALLADIUM
    symbol_canonical: XPD
  - venue: tradexyz
    symbol: xyz:BRENTOIL
    symbol_canonical: BZ

  # trade.xyz's tickers for the two Korean memory makers' USD-quoted shares,
  # which TxFlow and Polymarket spell out. Same scale, checked 2026-09-10:
  # xyz:SMSN 190.20 vs SAMSUNG 190.15-190.32, xyz:SKHX 1351.05 vs SKHYNIX
  # 1348.89-1349.00. (xyz:SKHY, the ADS near 190, already matches SKHY.)
  - venue: tradexyz
    symbol: xyz:SMSN
    symbol_canonical: SAMSUNG
  - venue: tradexyz
    symbol: xyz:SKHX
    symbol_canonical: SKHYNIX

  # QFEX quotes these in their HOME currency, not dollars, yet its adapter
  # names them by the bare ticker -- so each was matched, and hedged, against
  # the dollar listing elsewhere at a completely different scale. Checked
  # 2026-09-10: SAMSUNG-KRW 256,300 vs SAMSUNG 190.15; SKHYNIX-KRW 1,818,350 vs
  # SKHYNIX 1,348.89; HYUNDAI-KRW 380,950 vs xyz HYUNDAI 282.51; CXMT-CNY 55.26
  # vs CXMT 8.21; UNITREE-CNY 483.84 vs xyz UNITREE 72.06. The currency stays
  # in the key, so these are their own markets rather than a false hedge.
  - venue: qfex
    symbol: SAMSUNG-KRW
    symbol_canonical: SAMSUNG-KRW
  - venue: qfex
    symbol: SKHYNIX-KRW
    symbol_canonical: SKHYNIX-KRW
  - venue: qfex
    symbol: HYUNDAI-KRW
    symbol_canonical: HYUNDAI-KRW
  - venue: qfex
    symbol: KIA-KRW
    symbol_canonical: KIA-KRW
  - venue: qfex
    symbol: CXMT-CNY
    symbol_canonical: CXMT-CNY
  - venue: qfex
    symbol: UNITREE-CNY
    symbol_canonical: UNITREE-CNY
  - venue: qfex
    symbol: ZHIPU-HKD
    symbol_canonical: ZHIPU-HKD
  - venue: qfex
    symbol: SIVE-SEK
    symbol_canonical: SIVE-SEK

  # ---------------------------------------------------------------------------
  # Cross-protocol reconciliation, 2026-09-10. Every entry below was matched on
  # NAME and confirmed on PRICE from the same collection hour (quoted), so each
  # merge is one instrument at one scale and each split is two instruments that
  # had shared a ticker. Near-identical prices on DIFFERENT instruments are left
  # apart on purpose: Variational US500 (758.31) vs SPY (758.13-758.30) is an
  # index at a tenth against an ETF; trade.xyz XYZ100 (29,132.50) is its own
  # basket, not the Nasdaq-100; XAUT is tokenised gold, not spot.
  # ---------------------------------------------------------------------------

  # One ticker, two instruments.
  # QNT: Variational's QNT is the Quant token (65.68); trade.xyz's QNT is
  # pre-IPO Quantinuum (48.96), which Variational lists as QNTX (49.06).
  - venue: tradexyz
    symbol: xyz:QNT
    symbol_canonical: QNTX
  # BEAM: Variational's BEAM is the Beam token (0.0015); QFEX's is Beam
  # Therapeutics stock (24.32).
  - venue: qfex
    symbol: BEAM-USD
    symbol_canonical: BEAM-USD
  # US500: QFEX's contract is the full index (7,589.25), Variational's is a
  # tenth of it (758.31). QFEX's joins SP500 (Polymarket 7,590.25, xyz 7,588.15).
  - venue: qfex
    symbol: US500-USD
    symbol_canonical: SP500

  # Same instrument, different spelling.
  - venue: qfex # 505.21 vs Variational BRKB 505.92
    symbol: BRK.B-USD
    symbol_canonical: BRKB
  - venue: polymarket # 29,135.50 vs QFEX US100 29,132.00
    symbol: NAS100-USD
    symbol_canonical: US100
  - venue: polymarket # 4,320.70 vs XAU 4,318-4,331
    symbol: GOLD-USD
    symbol_canonical: XAU
  - venue: qfex # 4,320.95
    symbol: GOLD-USD
    symbol_canonical: XAU
  - venue: polymarket # 63.66 vs XAG 63.65-63.83
    symbol: SILVER-USD
    symbol_canonical: XAG
  - venue: qfex # 63.70
    symbol: SILVER-USD
    symbol_canonical: XAG
  - venue: polymarket # WTI 99.57 vs CL 99.36-99.86
    symbol: WTIOIL-USD
    symbol_canonical: CL
  - venue: nado # WTI 99.33
    symbol: WTI-PERP_USDT0
    symbol_canonical: CL
  - venue: polymarket # 104.22 vs BZ 104.42-104.53
    symbol: BRENTOIL-USD
    symbol_canonical: BZ
  - venue: variational # PUMPFUN 0.003872 vs PUMP 0.003894-0.003925
    symbol: PUMPFUN
    symbol_canonical: PUMP
  # 1,000-unit contracts: Nado and Polymarket write the thousand as a "k",
  # Variational and TxFlow as "1000". A plain PEPE / SHIB contract (TxFlow) is a
  # thousandth of the price and stays its own market.
  - venue: nado # 0.002683 vs 1000BONK 0.002680-0.002689
    symbol: kBONK-PERP_USDT0
    symbol_canonical: 1000BONK
  - venue: nado # 0.003306 vs Variational 1000PEPE 0.003311
    symbol: kPEPE-PERP_USDT0
    symbol_canonical: 1000PEPE
  - venue: polymarket # 0.003304
    symbol: KPEPE-USD
    symbol_canonical: 1000PEPE
  - venue: polymarket # 0.005086 = 1,000 x TxFlow SHIB 0.000005085
    symbol: KSHIB-USD
    symbol_canonical: 1000SHIB

  # Currencies by PAIR, the way Nado and the curated FX list already name them.
  # Hibachi quotes every currency in dollars (EUR 1.16, JPY 0.006478), so CAD
  # and JPY there are CADUSD / JPYUSD -- inverse to USDCAD / USDJPY. trade.xyz's
  # JPY is quoted the other way (154.22), matching Nado's USDJPY (154.08).
  - venue: hibachi
    symbol: AUD/USDT-P
    symbol_canonical: AUDUSD
  - venue: hibachi
    symbol: EUR/USDT-P
    symbol_canonical: EURUSD
  - venue: hibachi
    symbol: GBP/USDT-P
    symbol_canonical: GBPUSD
  - venue: hibachi
    symbol: NZD/USDT-P
    symbol_canonical: NZDUSD
  - venue: hibachi
    symbol: CAD/USDT-P
    symbol_canonical: CADUSD
  - venue: hibachi
    symbol: JPY/USDT-P
    symbol_canonical: JPYUSD
  - venue: tradexyz # 1.16
    symbol: xyz:EUR
    symbol_canonical: EURUSD
  - venue: tradexyz # 1.35
    symbol: xyz:GBP
    symbol_canonical: GBPUSD
  - venue: tradexyz # 154.22 vs Nado USDJPY 154.08
    symbol: xyz:JPY
    symbol_canonical: USDJPY
  # QFEX's FX listings are inactive today; named by pair now so they cannot
  # come back under a bare currency ticker.
  - venue: qfex
    symbol: AUD-USD
    symbol_canonical: AUDUSD
  - venue: qfex
    symbol: EUR-USD
    symbol_canonical: EURUSD
  - venue: qfex
    symbol: GBP-USD
    symbol_canonical: GBPUSD
  - venue: qfex
    symbol: USD-JPY
    symbol_canonical: USDJPY
