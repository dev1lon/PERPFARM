# Manual points-program data, ingested by `perpfarm ingest-manual`.
#
# venue_alpha / venue_beta are SYNTHETIC fixture venues used for dev and for
# scoring-engine tests (Phase 2) -- they are not real exchanges, so their
# numbers are illustrative, not placeholders for real unverified data.
# When adding a REAL venue here, confidence must reflect actual verification
# per CLAUDE.md: never write "confirmed" without a checked source.

points_programs:
  - venue: venue_alpha
    description_md: |
      Points accrue on **maker volume only**. 1 point per $1 of maker
      notional, doubled during the first 14 days a pair is listed (see
      pair_weights.yaml). Taker fills earn zero points.
    points_per_usd_volume_estimate: 1.0
    weight_notes: "2x boost for pairs listed <14 days (see pair_weights.yaml)"
    confidence: confirmed
    last_verified: 2026-07-01
    source: "own trades"

  - venue: venue_beta
    description_md: |
      Points accrue on **taker volume only** (anti-wash-trading rule: maker
      fills from the same wallet pair are excluded). 0.8 points per $1 of
      taker notional.
    points_per_usd_volume_estimate: 0.8
    weight_notes: null
    confidence: confirmed
    last_verified: 2026-07-01
    source: "own trades"

  - venue: variational
    description_md: |
      Omni points are distributed every Friday at 00:00 UTC for the prior
      week. Reward tiers add a 0–5% points boost; accounts that traded before
      launch receive an additional 10% boost. The public documentation does
      **not** disclose a points-per-volume emission formula, so PerpFarm does
      not calculate a definitive cost per point from public data alone. The
      second TradFi competition also distributed an additional 20,000 points
      proportional to competitor volume; competition bonuses are excluded from
      ongoing route economics.
    points_per_usd_volume_estimate: null
    weight_notes: "Referral rewards add 1 point per 10 points earned by referrals; exclude referral rewards, competition bonus points, and prizes from route economics."
    confidence: confirmed
    last_verified: 2026-07-16
    source: "https://docs.variational.io/omni/rewards/points"

  - venue: hibachi
    description_md: |
      **1,000,000 points per weekly epoch**, distributed every Monday 03:00
      UTC, split across all traders. Your share is driven by trading volume
      plus other variables (open-interest score, PnL, max drawdown, fees
      paid, referrals); trading quests can boost points up to +60%, and FX
      perps earn extra weekly multipliers. The exact per-variable weights are
      **not published** -- treat per-$ numbers as rough.
    # 1_000_000 points/week / observed weekly volume (~$88M = 24h volume
    # $12.5M x 7, summed across all live markets on 2026-07-12). Pro-rata
    # volume-share approximation of a multi-variable formula.
    points_per_usd_volume_estimate: 0.011
    weight_notes: "FX perps (AUD/GBP/EUR/NZD) earn more points + weekly FX multipliers; magnitude unpublished, no pair_weights rows until known."
    confidence: estimated
    last_verified: 2026-07-12
    source: "https://docs.hibachi.xyz/hibachi-rewards/hibachi-points"
